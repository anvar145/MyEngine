[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myengine"
version = "0.1.0"
description = "MyEngine — модульный 3D-движок с Python-скриптингом и редактором на PySide6"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyOpenGL>=3.1.7", "Pillow>=10"]

[project.optional-dependencies]
render = ["PySide6-Essentials>=6.6"]  # Qt-вьюпорт, offscreen-контекст, тесты GL
editor = ["PySide6-Essentials>=6.6"]
player = ["glfw>=2.6"]
gltf = ["pygltflib>=1.16"]
fbx = ["ufbx"]
audio = ["miniaudio"]
package = ["pyinstaller>=6"]  # сборка exe: myengine package
dev = ["pytest>=8", "pytest-timeout", "ruff>=0.6", "watchdog"]

[project.scripts]
myengine = "engine.cli:main"

[tool.setuptools]
packages = [
    "engine",
    "engine.audio",
    "engine.audio.backends",
    "engine.cli",
    "engine.core",
    "engine.core.input",
    "engine.core.jobs",
    "engine.core.resources",
    "engine.core.resources.cookers",
    "engine.core.resources.importers",
    "engine.core.resources.loaders",
    "engine.physics",
    "engine.player",
    "engine.rendering",
    "engine.scripting",
    "editor",
    "editor.bridge",
    "editor.i18n",
    "editor.models",
    "editor.panels",
    "editor.services",
    "editor.theme",
    "editor.viewport",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "editor/tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Скретч и артефакты не проверяем (.venv и build ruff исключает сам).
extend-exclude = ["_work", "Library", "pytest-of-*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "RUF001", # кириллица в строках и докстрингах — норма для проекта
    "RUF002",
    "RUF003",
    "RUF022", # __all__ группируется по смыслу (типы, объекты, ресурсы)
    "RUF023", # __slots__ группируется: сначала приватные, затем публичные
    "RUF100", # noqa-комментарии документируют осознанные исключения
    "B008",   # модели Qt обязаны иметь QModelIndex() в значениях по умолчанию
]

[tool.ruff.lint.per-file-ignores]
# В тестах длинные строки — это чаще всего исходники скриптов и ожидаемые
# сообщения; переносить их по границе 88 символов вредно для читаемости.
"**/tests/test_*.py" = ["E501"]
